const LK=['Name','Company','Email','Location','Fleet','Carrier','Renewal','Source'];
let cur=0,spd=1100,playing=false,toastTimer;

function load(idx,btn){cur=idx;document.querySelectorAll('.sc-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.getElementById('thSubject').textContent=SC[idx].subject;renderInfo(idx);resetThread();}

function renderInfo(idx){
  const sc=SC[idx];
  document.getElementById('leadInfo').innerHTML=`<div class="sb-title">Lead Data</div>${LK.map((k,i)=>`<div class="info-r"><span class="info-k">${k}</span><span class="info-v ${sc.urgent.includes(i)?'red':''} ${i===4?'gold':''} ${i===7?'green':''}">${sc.lead[i]}</span></div>`).join('')}`;
}

async function play(){
  if(playing)return;playing=true;
  const pb=document.getElementById('playBtn');pb.className='btn play busy';pb.textContent='⏳ Playing...';
  const thread=document.getElementById('thread');thread.innerHTML='';
  const sc=SC[cur];
  for(let i=0;i<sc.msgs.length;i++){
    const m=sc.msgs[i];
    const dv=document.createElement('div');dv.className='divider';dv.innerHTML=`<hr><span>${m.day}</span><hr>`;thread.appendChild(dv);await s(80);dv.classList.add('show');await s(spd*.3);
    const now=new Date();const t=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
    const preview=m.body.split('\n').filter(l=>l.trim())[1]?.trim()||m.body.slice(0,80);
    const card=document.createElement('div');
    const types=m.type.split(' ');
    card.className=`ecard ${types.includes('in')?'in':'out'} ${types.includes('dual')?'dual':''} ${types.includes('alert')?'alert':''}`;
    card.innerHTML=`<div class="ehead" onclick="toggle(this)"><div class="avatar ${m.av}">${m.avt}</div><div class="einfo"><div class="efrom">${m.from} <span class="efrom-sub">&lt;${m.sub}&gt;</span></div><div class="epreview">${preview}...</div></div><div class="eright"><span class="etime">${t}</span><span class="ebadge ${m.bc}">${m.badge}</span></div></div><div class="ebody open"><div class="efull-head"><div class="fh"><span class="fhk">from:</span><span>${m.from} &lt;${m.sub}&gt;</span></div><div class="fh"><span class="fhk">to:</span><span>${m.type==='in'?'theinsurancemanwhocan@gmail.com':sc.lead[2]}</span></div><div class="fh"><span class="fhk">date:</span><span>${m.day}</span></div></div><div class="esubject">${m.subject}</div><div class="etext">${m.body}</div>${m.sig?`<div class="esig"><strong>Richard Doron</strong>Commercial Insurance Specialist<br>📞 (609) 757-2221<br><br><span style="color:#999;font-size:10px;">To unsubscribe reply STOP</span></div>`:''}<div class="efooter">${m.footer.map(f=>`<span class="${f.c}">${f.t}</span>`).join('')}</div></div>`;
    thread.appendChild(card);await s(80);card.classList.add('show');thread.scrollTop=thread.scrollHeight;
    if(m.isReply){await s(spd*.7);toast('📨 Reply Detected!',`${sc.lead[0]} replied. Sequence stopped immediately.`);}
    if(m.isAlert){await s(spd*.5);toast('🔥 Hot Lead!','Instant notification fired to your inbox!');}
    if(m.isBreakup){await s(spd*.7);toast('Sequence Complete',`${sc.lead[1]} marked COLD. Zero manual work needed.`);}
    await s(spd*1.5);
  }
  pb.className='btn play';pb.textContent='▶ Play Again';playing=false;
}

function resetThread(){playing=false;document.getElementById('thread').innerHTML=`<div class="empty"><div>📬</div><p>Click <strong>▶ Play Sequence</strong> to watch the agent<br>send real AI-written emails — focused entirely<br>on the prospect's renewal, carrier, and savings</p></div>`;document.getElementById('playBtn').className='btn play';document.getElementById('playBtn').textContent='▶ Play Sequence';}
function toggle(h){h.nextElementSibling.classList.toggle('open');}
function setSpd(v,btn){spd=v;document.querySelectorAll('.sp').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function s(ms){return new Promise(r=>setTimeout(r,ms));}
function toast(title,body){clearTimeout(toastTimer);document.getElementById('tt').textContent=title;document.getElementById('tb').textContent=body;const t=document.getElementById('toast');t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),4500);}
setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});},1000);
renderInfo(0);document.getElementById('thSubject').textContent=SC[0].subject;
</script>
